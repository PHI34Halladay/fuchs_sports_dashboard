<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff3b30"/>
      <stop offset="0.55" stop-color="#e5251c"/>
      <stop offset="1" stop-color="#b3130d"/>
    </linearGradient>
    <linearGradient id="s" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ffeceb"/>
    </linearGradient>
    <mask id="slice" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
      <rect width="512" height="512" fill="#fff"/>
      <!-- diagonaler Schnitt durch das S -->
      <line x1="120" y1="372" x2="392" y2="148" stroke="#000" stroke-width="12"/>
    </mask>
    <clipPath id="tile"><rect width="512" height="512" rx="112"/></clipPath>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <g clip-path="url(#tile)">
    <!-- dezente Speed-Streifen im Hintergrund -->
    <g stroke="#fff" stroke-linecap="round" opacity="0.12" stroke-width="14">
      <line x1="-20" y1="420" x2="200" y2="250"/>
      <line x1="60" y1="500" x2="330" y2="290"/>
      <line x1="250" y1="540" x2="560" y2="300"/>
    </g>
    <!-- Glanz oben links -->
    <ellipse cx="150" cy="60" rx="260" ry="120" fill="#fff" opacity="0.10" transform="rotate(-20 150 60)"/>
  </g>

  <!-- Schatten -->
  <g transform="translate(0 10)" opacity="0.22" mask="url(#slice)">
    <path d="M336 156 H232 A52 52 0 0 0 232 260 H280 A52 52 0 0 1 280 364 H176"
          transform="translate(256 260) scale(1.32) skewX(-8) translate(-256 -260)"
          fill="none" stroke="#4a0804" stroke-width="58" stroke-linecap="butt" stroke-linejoin="round"/>
  </g>

  <!-- Das S -->
  <g mask="url(#slice)">
    <path d="M336 156 H232 A52 52 0 0 0 232 260 H280 A52 52 0 0 1 280 364 H176"
          transform="translate(256 260) scale(1.32) skewX(-8) translate(-256 -260)"
          fill="none" stroke="url(#s)" stroke-width="58" stroke-linecap="butt" stroke-linejoin="round"/>
  </g>

  <!-- Akzentpunkt (Ball) -->
  <circle cx="404" cy="414" r="16" fill="#fff"/>
</svg>
