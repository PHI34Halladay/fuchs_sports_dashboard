<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#07080b" />
  <link rel="manifest" href="manifest.webmanifest" crossorigin="use-credentials" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <meta name="apple-mobile-web-app-title" content="Sport Dashboard" />
  <title>Sport Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" type="image/svg+xml" href="logo.svg" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-row">
      <a class="brand" href="./" aria-label="Sport Dashboard – Startseite">
        <img class="brand-logo" src="logo.svg" alt="" width="30" height="30" />
        <span class="brand-name">Sport<b>Dashboard</b></span>
      </a>
      <button type="button" class="live-today-btn" id="todayNavBtn" aria-pressed="false" title="Alles, was heute live läuft – alle Sportarten">
        <span class="lt-dot" aria-hidden="true"></span>
        <span class="lt-text">Heute</span>
        <span class="lt-count" id="todayCount" hidden></span>
      </button>
      <div class="topbar-tools">
        <button type="button" class="search-trigger" id="searchBtn" aria-label="Teams und Spieler suchen">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M16.5 16.5 21 21" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
          <span class="search-trigger-text">Team oder Spieler suchen</span>
          <kbd>/</kbd>
        </button>
        <button type="button" class="sync-trigger" id="syncBtn" aria-label="Geräte synchronisieren" title="Teams & gemerkte Spiele auf allen Geräten">
          <svg viewBox="0 0 24 24" width="19" height="19" aria-hidden="true"><path d="M7 18.5h10.5a4 4 0 0 0 .6-7.96A6 6 0 0 0 6.6 9.2 4.7 4.7 0 0 0 7 18.5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
          <i class="sync-dot" id="syncDot"></i>
        </button>
      </div>
    </div>
    <nav class="sports" id="sports" aria-label="Sportarten"></nav>
    <nav class="leaguebar" id="leaguebar" aria-label="Ligen"></nav>
  </header>

  <main class="container">
    <section class="hero" id="hero">
      <div class="hero-title">
        <div class="hero-logo" id="heroLogo"></div>
        <div>
          <div class="hero-kicker" id="heroKicker"></div>
          <h1 class="hero-name" id="heroName"></h1>
        </div>
      </div>
      <div class="toolbar">
        <div class="tabs" role="tablist" id="tabs">
          <button role="tab" data-tab="scores" class="tab">Spiele</button>
          <button role="tab" data-tab="standings" class="tab">Tabelle</button>
          <button role="tab" data-tab="news" class="tab">News</button>
        </div>
        <div class="controls" id="scoreControls">
          <div class="datenav">
            <button class="icon-btn" id="prevDay" title="Vorheriger Spieltag" aria-label="Vorheriger Spieltag">‹</button>
            <button type="button" class="date-label" id="dateBtn" aria-haspopup="dialog" aria-label="Kalender öffnen">
              <span id="dateText">Heute</span>
              <svg class="date-ico" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M3.5 10h17M8 3v4M16 3v4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
            </button>
            <button class="icon-btn" id="nextDay" title="Nächster Spieltag" aria-label="Nächster Spieltag">›</button>
          </div>
          <button type="button" class="today-btn" id="todayBtn" title="Zum aktuellen Spieltag">Aktuell</button>
          <label class="toggle" id="top25Toggle" hidden>
            <input type="checkbox" id="top25Only" />
            <span>Top 25</span>
          </label>
        </div>
      </div>
    </section>

    <div id="status" class="status" hidden></div>
    <section id="content" aria-live="polite"></section>
  </main>

  <footer class="footer">
    <span id="source">Daten: ESPN (inoffizielle öffentliche API) · Zeiten in deiner Ortszeit</span>
    <span id="updated"></span>
    <label class="toggle" id="autoReloadToggle" title="Aktualisiert die Ergebnisse automatisch alle 30 Sekunden (ohne die Seite neu zu laden) – z. B. für einen dauerhaft angezeigten Bildschirm">
      <input type="checkbox" id="autoReload" />
      <span>Auto-Reload</span>
    </label>
    <span class="version">Version <span id="version"></span></span>
  </footer>

  <dialog class="search" id="search" aria-label="Suche">
    <div class="search-box">
      <div class="search-input-row">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M16.5 16.5 21 21" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
        <input type="search" id="searchInput" placeholder="Team, Spieler oder Liga …" autocomplete="off" spellcheck="false" enterkeyhint="search" />
        <button type="button" class="search-close" id="searchClose" aria-label="Suche schließen">Esc</button>
      </div>
      <div class="search-results" id="searchResults"></div>
    </div>
  </dialog>

  <dialog class="syncdlg" id="syncDlg" aria-label="Synchronisieren">
    <button type="button" class="pf-close" id="syncClose" aria-label="Schließen">×</button>
    <div class="sync-body" id="syncBody"></div>
  </dialog>

  <dialog class="caldlg" id="calDlg" aria-label="Kalender">
    <div class="cal-body" id="calBody"></div>
  </dialog>

  <script src="logo.js"></script>
  <script src="gamecast.js"></script>
  <script src="hockeydetail.js"></script>
  <script src="amateurdetail.js"></script>
  <script src="profile.js"></script>
  <script src="reader.js"></script>
  <script src="app.js"></script>
</body>
</html>
